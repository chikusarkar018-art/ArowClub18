    <script>
      /* Bulletproof Console Error Shield & Iframe Exception Guard */
      (function() {
        if (typeof window === 'undefined') return;
        const _origErr = console.error;
        console.error = function(...args) {
          try {
            const str = args.map(function(a) {
              if (typeof a === 'string') return a;
              if (a instanceof Error) return (a.message || '') + ' ' + (a.stack || '');
              try { return JSON.stringify(a); } catch(_) { return String(a); }
            }).join(' ');

            if (
              str.includes('WebSocket') ||
              str.includes('websocket') ||
              str.includes('ws://') ||
              str.includes('wss://') ||
              str.includes('[vite]') ||
              str.includes('AudioContext') ||
              str.includes('audio') ||
              str.includes('autoplay') ||
              str.includes('ResizeObserver') ||
              str.includes('favicon.ico') ||
              str.includes('ERR_BLOCKED_BY_CLIENT') ||
              str.includes('Popups are not allowed')
            ) {
              return;
            }
          } catch (_) {}
          _origErr.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(e) {
          e.preventDefault();
        }, true);

        window.addEventListener('error', function(e) {
          const m = (e && (e.message || '')) + '';
          if (
            m.includes('Script error') ||
            m.includes('ResizeObserver') ||
            m.includes('WebSocket') ||
            m.includes('AudioContext') ||
            m.includes('net::ERR')
          ) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
